<app-cabecalho></app-cabecalho>

<main class="admin-cadastro-produto">
  <h1>{{ modoEdicao ? 'Editar produto' : 'Novo produto' }}</h1>
  <p class="admin-cadastro-produto__subtitulo">Preencha as informações do produto abaixo.</p>

  <form (ngSubmit)="salvarProduto()">
    <div class="admin-cadastro-produto__grade">
      <div class="admin-cadastro-produto__campos">
        <label>
          Nome do produto
          <input type="text" name="nome" placeholder="Ex: Camiseta básica" [(ngModel)]="dadosFormulario.nome" required />
        </label>

        <label>
          Descrição
          <textarea
            rows="4"
            name="descricao"
            placeholder="Descreva os detalhes do produto"
            [(ngModel)]="dadosFormulario.descricao"
          ></textarea>
        </label>

        <div class="admin-cadastro-produto__linha-dupla">
          <label>
            Preço
            <input type="number" step="0.01" name="preco" placeholder="R$ 0,00" [(ngModel)]="dadosFormulario.preco" required />
          </label>

          <label>
            Estoque
            <input type="number" name="estoque" placeholder="0" [(ngModel)]="dadosFormulario.quantidade_estoque" required />
          </label>
        </div>

        <label class="admin-cadastro-produto__disponivel">
          <input type="checkbox" name="disponivel" [(ngModel)]="dadosFormulario.disponivel" />
          Produto disponível
        </label>
      </div>

      <div class="admin-cadastro-produto__upload">
        <label>Imagem do produto</label>
        <label class="admin-cadastro-produto__area-upload">
          <img *ngIf="urlPreviewImagem" [src]="urlPreviewImagem" alt="Pré-visualização" />
          <span *ngIf="!urlPreviewImagem">Arraste uma imagem ou clique para selecionar</span>
          <input type="file" accept="image/*" (change)="aoSelecionarImagem($event)" hidden />
        </label>
        <p class="admin-cadastro-produto__dica">JPG ou PNG, até 5MB.</p>
      </div>
    </div>

    <p class="admin-cadastro-produto__erro" *ngIf="mensagemErro">{{ mensagemErro }}</p>

    <div class="admin-cadastro-produto__rodape">
      <a routerLink="/admin/produtos" class="admin-cadastro-produto__cancelar">Cancelar</a>
      <button type="submit" [disabled]="salvando">
        {{ salvando ? 'Salvando...' : 'Salvar produto' }}
      </button>
    </div>
  </form>
</main>
