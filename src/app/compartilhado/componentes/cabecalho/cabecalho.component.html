<header class="cabecalho">
  <a routerLink="/produtos" class="cabecalho__logo">
    <span class="cabecalho__logo-marca"></span>
    marketplace
  </a>

  <div class="cabecalho__busca">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" placeholder="Buscar produtos..." />
  </div>

  <div class="cabecalho__acoes" *ngIf="autenticacaoService.usuarioLogado() as usuario">
    <a
      *ngIf="usuario.tipo_usuario === 'cliente'"
      routerLink="/carrinho"
      class="cabecalho__carrinho"
      aria-label="Carrinho"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      <span
        class="cabecalho__carrinho-contador"
        *ngIf="carrinhoService.quantidadeTotalItens() as quantidade"
        >{{ quantidade }}</span
      >
    </a>

    <a *ngIf="usuario.tipo_usuario === 'admin'" routerLink="/admin/produtos" class="cabecalho__link-admin">
      Produtos
    </a>

    <a *ngIf="usuario.tipo_usuario === 'admin'" routerLink="/admin/pedidos" class="cabecalho__link-admin">
      Pedidos
    </a>

    <div class="cabecalho__usuario">
      <span class="cabecalho__avatar">{{ iniciais(usuario.nome) }}</span>
      <span class="cabecalho__nome-usuario">{{ usuario.nome }}</span>
    </div>

    <button type="button" class="cabecalho__sair" (click)="sair()">Sair</button>
  </div>
</header>
